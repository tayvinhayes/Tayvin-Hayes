<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Floorplot Takeoff</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: app shell — header, full-bleed drawing with a docked sheet (bottom on phones, right on wide screens), tab bar */
:root{
  --paper:#e9ece7; --sheet:#f8f9f6; --ink:#1c2830; --muted:#5d6a6f; --line:#c6cdc6;
  --grid:#dfe3dd; --grid-major:#c9d0c8; --accent:#d4602a; --accent-ink:#fff; --sel:#1f6fb2;
  --good:#2e7d4f; --bad:#b8402c; --field:#ffffff; --hatch:#9aa59e;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11171a; --sheet:#182025; --ink:#e3e8e4; --muted:#93a0a3; --line:#2e3a3f;
  --grid:#1f292e; --grid-major:#2b373d; --accent:#ec7840; --accent-ink:#1a0e08; --sel:#5aa6e6;
  --good:#5cc08a; --bad:#ef7a64; --field:#10161a; --hatch:#56636a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11171a; --sheet:#182025; --ink:#e3e8e4; --muted:#93a0a3; --line:#2e3a3f;
  --grid:#1f292e; --grid-major:#2b373d; --accent:#ec7840; --accent-ink:#1a0e08; --sel:#5aa6e6;
  --good:#5cc08a; --bad:#ef7a64; --field:#10161a; --hatch:#56636a; color-scheme:dark}
*{box-sizing:border-box}
html,body,button,.btn,.k,.tool,.chip,.mitem,.tabbar button{touch-action:manipulation}
html,body{height:100%;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sheet)}
button{font:inherit;color:inherit}
.app{height:100%;display:flex;flex-direction:column}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{background:var(--sheet);border-bottom:1px solid var(--line);flex:0 0 auto}
.top .gut{display:flex;align-items:center;gap:10px;padding-block:8px;min-height:52px}
.brand{font:700 22px var(--display);letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand svg{width:22px;height:22px}
.ptitle{font:700 19px var(--display);letter-spacing:.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{font:500 15px var(--body);background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 13px;cursor:pointer;line-height:1.15;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:14px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.btn svg{width:18px;height:18px}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.ble{font:12px var(--mono);color:var(--muted)} .ble.on{color:var(--good)}
.view{flex:1 1 auto;min-height:0;overflow:auto}
.view[hidden]{display:none!important}
/* Tab bar */
.tabbar{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:var(--sheet);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar button{background:none;border:0;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 11px var(--body);letter-spacing:.03em;color:var(--muted);cursor:pointer}
.tabbar svg{width:22px;height:22px}
.tabbar button[aria-selected="true"]{color:var(--accent)}
/* Drawing */
#v-draw{position:relative;overflow:hidden}
#canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--sheet);display:block}
.floattools{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));display:flex;gap:6px;z-index:4}
.floattools .btn{box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.fab{position:absolute;right:max(14px,env(safe-area-inset-right,0px));z-index:6;width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;font:400 34px/1 var(--body);box-shadow:0 3px 10px rgb(0 0 0 / .25);cursor:pointer;display:flex;align-items:center;justify-content:center}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--sheet);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgb(0 0 0 / .08);max-height:62%;overflow:auto;padding-block:10px 12px;display:flex;flex-direction:column;gap:9px}
@media (min-width:900px){ .sheet{left:auto;top:0;width:380px;max-height:none;border-top:0;border-left:1px solid var(--line);box-shadow:none} #canvas{right:380px;width:auto} }
.srow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.srow > *{min-width:0}
.stitle{font:700 17px var(--display);letter-spacing:.05em;text-transform:uppercase;flex:1}
.smsg{font-size:14px;color:var(--muted);line-height:1.4}
.smsg.ok{color:var(--good)} .smsg.err{color:var(--bad)}
.smsg b{color:var(--ink)}
.stat{font:13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.stat b{color:var(--ink);font-weight:600}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border:1px solid var(--line);border-radius:8px;background:var(--field);font:500 12px var(--body);cursor:pointer;color:var(--ink)}
.tool svg{width:24px;height:24px}
.tool.danger{color:var(--bad)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{font:500 13px var(--mono);border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:999px;padding:7px 11px;white-space:nowrap;cursor:pointer;font-variant-numeric:tabular-nums}
.chip.need{border-color:var(--accent);color:var(--accent)}
.chip.auto{color:var(--muted);border-style:dashed}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);border-style:solid}
input,select,textarea{font:16px var(--body);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);flex:1;min-width:120px}
#rm-name{font-weight:600;flex:1 1 120px}
#rm-prod{flex:1 1 150px}
/* Keypad */
.kp{display:flex;flex-direction:column;gap:6px}
.kp-disp{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border:2px solid var(--accent);border-radius:8px;padding:6px 12px;background:var(--field)}
.kp-disp .lbl{font:600 12px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kp-disp .val{font:600 26px var(--mono);font-variant-numeric:tabular-nums}
.kp-disp .val.ph{color:var(--muted);font-weight:400}
.kp-fr{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.kp-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.k{height:46px;border:1px solid var(--line);border-radius:8px;background:var(--field);font:500 20px var(--mono);cursor:pointer;color:var(--ink)}
.kp-fr .k{height:40px;font:600 21px var(--body)}
.k.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.k.set{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font:700 17px var(--body)}
.k.fn{font:600 14px var(--body);color:var(--muted)}
/* Menus & dialogs */
.scrim{position:fixed;inset:0;background:rgb(10 16 20 / .35);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.menu{background:var(--sheet);width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;max-height:85%;overflow:auto}
.menu h3{margin:0;font:700 18px var(--display);letter-spacing:.06em;text-transform:uppercase}
.menu .group{font:600 12px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mitem{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border:1px solid var(--line);border-radius:10px;background:var(--field);cursor:pointer;font:500 13px var(--body);text-align:center;color:var(--ink)}
.mitem svg{width:30px;height:30px}
.mitem:disabled{opacity:.4;cursor:default}
/* Pages (home, products, worksheet, proposal, info) */
.page{max-width:900px;margin:0 auto;padding-block:16px 28px;display:flex;flex-direction:column;gap:14px}
.page h2{font:700 22px var(--display);letter-spacing:.03em;margin:0}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font:600 14px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.plist{display:flex;flex-direction:column;gap:10px}
.pcard{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left}
.pcard .nm{font:700 19px var(--display);letter-spacing:.02em}
.pcard .sub{font-size:13px;color:var(--muted)}
.pcard .tot{font:600 15px var(--mono);text-align:right}
.pcard .acts{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font:600 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px;border-bottom:2px solid var(--ink)}
td{padding:8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--mono);font-size:13px;white-space:nowrap}
td .sub{display:block;font-size:12px;color:var(--muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);margin-right:6px}
.totals{display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
.totals div{display:flex;justify-content:space-between;font-family:var(--mono);font-size:14px}
.totals .grand{border-top:2px solid var(--ink);padding-top:8px;margin-top:4px;font:700 26px var(--display)}
.warnbox{margin:0;padding:10px 12px;border-radius:8px;border:1px solid var(--accent);color:var(--ink);font-size:14px;line-height:1.45;background:var(--paper)}
.prod{border-top:5px solid var(--c)}
.kind{font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.xrow{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(64px,1fr)) auto;gap:6px;align-items:end}
@media (max-width:560px){ .xrow{grid-template-columns:1fr 1fr 1fr} .xrow .nm{grid-column:1/-1} }
.proposal{background:#fff;color:#1c2830;border:1px solid var(--line);border-radius:10px;padding:28px;display:flex;flex-direction:column;gap:16px}
.proposal h1{font:700 30px var(--display);margin:0;letter-spacing:.02em}
.proposal .meta{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:14px;line-height:1.5}
.proposal th{color:#5d6a6f;border-bottom-color:#1c2830} .proposal td{border-bottom-color:#d5dad5}
.proposal .terms{font-size:13px;line-height:1.5;color:#3d4a50;white-space:pre-wrap}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:20px;font-size:12px;color:#5d6a6f}
.sig div{border-top:1px solid #1c2830;padding-top:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--sheet);padding:10px 14px;border-radius:8px;display:flex;gap:12px;align-items:center;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:var(--accent);font:600 14px var(--body);cursor:pointer}
@media (max-width:600px){ th.ml,td.ml{display:none} .proposal{padding:18px} }
@media print{ body *{visibility:hidden} .proposal,.proposal *{visibility:visible} .proposal{position:absolute;inset:0;border:0} }
@media (prefers-reduced-motion:no-preference){ .sheet{transition:box-shadow .2s} .sheet.flash{box-shadow:inset 0 0 0 3px var(--good)} }
</style>

<div class="app" id="app">
  <!-- HOME -->
  <header class="top" id="home-top"><div class="gut">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3z"/><path d="M3 12h9v9" stroke="var(--accent)"/></svg>Floorplot</div>
    <span style="flex:1"></span>
    <button class="btn primary" id="new-proj">+ New project</button>
  </div></header>
  <main class="view" id="v-home"><div class="page gut">
    <h2>Projects</h2>
    <div class="plist" id="plist"></div>
  </div></main>

  <!-- PROJECT -->
  <header class="top" id="proj-top" hidden><div class="gut">
    <button class="btn ghost sm" id="to-home" aria-label="All projects">‹ Projects</button>
    <div class="ptitle" id="ptitle"></div>
    <span class="ble" id="ble-state"></span>
    <button class="btn sm" id="ble-connect" hidden>Connect D2</button>
    <button class="btn ghost sm" id="ble-disconnect" hidden>Disconnect</button>
  </div></header>

  <main class="view" id="v-draw" hidden>
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMinYMin meet">
      <defs>
        <pattern id="g1" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0H0V1" fill="none" stroke="var(--grid)" stroke-width="0.04"/></pattern>
        <pattern id="g5" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="url(#g1)"/><path d="M5 0H0V5" fill="none" stroke="var(--grid-major)" stroke-width="0.07"/></pattern>
        <pattern id="hatch" width="0.6" height="0.6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V0.6" stroke="var(--hatch)" stroke-width="0.12"/></pattern>
      </defs>
      <rect id="gridbg" fill="url(#g5)"/>
      <g id="layer"></g>
    </svg>
    <div class="floattools">
      <button class="btn sm" id="fit">Fit</button>
      <button class="btn sm" id="undo-act" hidden>Undo</button>
      <button class="btn sm" id="redo-act" hidden>Redo</button>
    </div>
    <button class="fab" id="fab" aria-label="Add">+</button>
    <section class="sheet gut" id="sheet" aria-live="polite"></section>
  </main>

  <main class="view" id="v-products" hidden><div class="page gut">
    <div class="srow"><h2 style="flex:1">Products</h2><button class="btn" id="add-roll">+ Carpet (roll)</button><button class="btn" id="add-box">+ Boxed (LVP, tile, wood)</button></div>
    <div class="products" id="products" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px"></div>
  </div></main>

  <main class="view" id="v-sheet" hidden><div class="page gut">
    <div class="srow"><h2 style="flex:1">Worksheet</h2><button class="btn" id="add-stairs">+ Stairs</button><button class="btn" id="add-item">+ Line item</button></div>
    <p class="warnbox" id="ws-warn" hidden></p>
    <div class="card"><div class="tbl"><table>
      <thead><tr><th>Item</th><th class="n">Qty</th><th class="n ml">Material</th><th class="n ml">Labor</th><th class="n">Total</th></tr></thead>
      <tbody id="ws-body"></tbody></table></div></div>
    <div class="card" id="extras-card"><h3>Stairs &amp; extra items</h3><div id="extras" style="display:flex;flex-direction:column;gap:10px"></div></div>
    <div class="card"><div class="srow">
      <label class="f">Markup (%)<input id="ws-markup" type="number" inputmode="decimal" step="1" min="0"></label>
      <label class="f">Tax on materials (%)<input id="ws-tax" type="number" inputmode="decimal" step="0.025" min="0"></label>
    </div><div class="totals" id="ws-totals"></div></div>
  </div></main>

  <main class="view" id="v-proposal" hidden><div class="page gut">
    <div class="srow"><h2 style="flex:1">Proposal</h2><button class="btn" id="copy-prop">Copy as text</button><button class="btn primary" id="print-prop" hidden>Print / Save PDF</button></div>
    <div class="proposal" id="proposal"></div>
  </div></main>

  <main class="view" id="v-info" hidden><div class="page gut">
    <h2>Project info</h2>
    <div class="card">
      <div class="srow"><label class="f">Project name<input id="i-name"></label><label class="f">Customer<input id="i-customer"></label></div>
      <div class="srow"><label class="f">Phone<input id="i-phone" inputmode="tel"></label><label class="f">Email<input id="i-email" inputmode="email"></label></div>
      <label class="f">Job address<input id="i-address"></label>
      <label class="f">Notes<textarea id="i-notes" rows="3"></textarea></label>
    </div>
    <h2>Your business</h2>
    <div class="card">
      <div class="srow"><label class="f">Business name<input id="s-biz"></label><label class="f">Phone<input id="s-phone" inputmode="tel"></label></div>
      <div class="srow"><label class="f">Baseboard material ($/lf)<input id="s-bbp" type="number" inputmode="decimal" step="0.05"></label><label class="f">Baseboard labor ($/lf)<input id="s-bbl" type="number" inputmode="decimal" step="0.05"></label></div>
      <div class="srow"><label class="f">Transition strip ($ each)<input id="s-trp" type="number" inputmode="decimal" step="0.5"></label><label class="f">Transition labor ($ each)<input id="s-trl" type="number" inputmode="decimal" step="0.5"></label></div>
      <div class="srow"><label class="f">Default tax (%)<input id="s-tax" type="number" inputmode="decimal" step="0.025"></label><label class="f">Default markup (%)<input id="s-markup" type="number" inputmode="decimal" step="1"></label></div>
      <label class="f">Proposal terms<textarea id="s-terms" rows="4"></textarea></label>
    </div>
  </div></main>

  <nav class="tabbar" id="tabbar" role="tablist" hidden>
    <button role="tab" data-tab="draw" id="t-draw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v16H4z"/><path d="M4 13h8v7"/></svg>Drawing</button>
    <button role="tab" data-tab="products" id="t-products"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="8" height="7" rx="1"/><rect x="13" y="4" width="8" height="7" rx="1"/><rect x="3" y="13" width="8" height="7" rx="1"/><rect x="13" y="13" width="8" height="7" rx="1"/></svg>Products</button>
    <button role="tab" data-tab="sheet" id="t-sheet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 3h14v18H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Worksheet</button>
    <button role="tab" data-tab="proposal" id="t-proposal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 17l2 2 4-5"/></svg>Proposal</button>
    <button role="tab" data-tab="info" id="t-info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>Info</button>
  </nav>
</div>
<div class="toast" id="toast" hidden><span id="toast-msg"></span><button id="toast-act" hidden></button></div>
<div id="modal"></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = p => p + Math.random().toString(36).slice(2,9);
const money = n => '$' + (n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const num = (n,d=1) => (n||0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const clone = o => JSON.parse(JSON.stringify(o));

// ================= geometry =================
const r96 = v => Math.round(v*1536)/1536;
const FR=['','⅛','¼','⅜','½','⅝','¾','⅞'];
function fmtLen(ft){ let e=Math.round(ft*96); const f=Math.floor(e/96); e-=f*96; const i=Math.floor(e/8), fr=e%8; return f+'′'+(i||fr?' '+(i||'')+FR[fr]+'″':''); }
const fmtIn = ft => { const e=Math.round(Math.abs(ft)*96); const i=Math.floor(e/8), fr=e%8; return (i||(fr?'':'0'))+FR[fr]+'″'; };
function area(p){ let a=0; for(let i=0;i<p.length;i++){const [x1,y1]=p[i],[x2,y2]=p[(i+1)%p.length]; a+=x1*y2-x2*y1;} return a/2; }
function perim(p){ let s=0; for(let i=0;i<p.length;i++){const [x1,y1]=p[i],[x2,y2]=p[(i+1)%p.length]; s+=Math.hypot(x2-x1,y2-y1);} return s; }
function bbox(p){ const xs=p.map(q=>q[0]), ys=p.map(q=>q[1]); return {x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)}; }
function centroid(p){ const A=area(p); if(Math.abs(A)<1e-6){const b=bbox(p);return [b.x+b.w/2,b.y+b.h/2];} let cx=0,cy=0; for(let i=0;i<p.length;i++){const [x1,y1]=p[i],[x2,y2]=p[(i+1)%p.length]; const f=x1*y2-x2*y1; cx+=(x1+x2)*f; cy+=(y1+y2)*f;} return [cx/(6*A),cy/(6*A)]; }
function axisOf(p,i){ const a=p[i], b=p[(i+1)%p.length]; const dx=b[0]-a[0], dy=b[1]-a[1]; const L=Math.hypot(dx,dy); if(L<1e-9) return null;
  if(Math.abs(dy)<1e-6) return {ax:'x',s:Math.sign(dx),L}; if(Math.abs(dx)<1e-6) return {ax:'y',s:Math.sign(dy),L}; return {ax:'d',ux:dx/L,uy:dy/L,L}; }
function needsMeasure(r,i){ if(r.measured[i]) return false; const a=axisOf(r.pts,i); if(!a) return false; if(a.ax==='d') return true;
  for(let j=0;j<r.pts.length;j++){ if(j===i||r.measured[j]) continue; const b=axisOf(r.pts,j); if(b&&b.ax===a.ax) return true; } return false; }
const wallState = (r,i) => r.measured[i]?'done':needsMeasure(r,i)?'need':'auto';
function nextNeeded(r,from){ const n=r.pts.length; for(let k=1;k<=n;k++){ const j=((from+k)%n+n)%n; if(needsMeasure(r,j)) return j; } return null; }
const needCount = r => { const c={x:0,y:0,d:0}; r.pts.forEach((_,i)=>{ const a=axisOf(r.pts,i); if(a&&!r.measured[i]) c[a.ax]++; }); return Math.max(0,c.x-1)+Math.max(0,c.y-1)+c.d; };
function sideOf(r,i){ const a=axisOf(r.pts,i); if(!a||a.ax==='d') return 'angled'; const cw=area(r.pts)>0;
  const m = a.ax==='x' ? (a.s>0?'top':'bottom') : (a.s>0?'right':'left'); return cw?m:{top:'bottom',bottom:'top',left:'right',right:'left'}[m]; }
// Set wall i to length L; walls on the same axis stretch to keep the room closed (unmeasured ones first).
function setWall(r,i,L){
  const p=r.pts, n=p.length, w=axisOf(p,i); if(!w) return 'That wall has no length.';
  const delta=L-w.L; if(Math.abs(delta)<1/192){ r.measured[i]=true; return true; }
  const tx = w.ax==='x'?w.s*delta : w.ax==='y'?0 : w.ux*delta, ty = w.ax==='y'?w.s*delta : w.ax==='x'?0 : w.uy*delta;
  const backup=p.map(q=>[...q]), mbackup=[...r.measured];
  const shift=(ax,amt)=>{ if(Math.abs(amt)<1e-9) return true; const c=[];
    for(let k=1;k<n;k++){ const j=(i+k)%n, a=axisOf(r.pts,j); if(!a||a.ax!==ax) continue; const nv=a.s*a.L-amt; if(Math.sign(nv)!==a.s||Math.abs(nv)<0.05) continue; c.push({k,score:(r.measured[j]?2:0)+(Math.sign(amt)===-a.s?0:1)+k*0.001}); }
    if(!c.length) return false; c.sort((a,b)=>a.score-b.score); const k=c[0].k; r.measured[(i+k)%n]=false;
    for(let m=1;m<=k;m++){ const v=(i+m)%n; r.pts[v]=[r96(r.pts[v][0]+(ax==='x'?amt:0)), r96(r.pts[v][1]+(ax==='y'?amt:0))]; } return true; };
  if(!shift('x',tx) || !shift('y',ty)){ r.pts=backup; r.measured=mbackup; return `A ${fmtLen(L)} wall won't fit this shape. Check the reading, or drag the corners first.`; }
  r.measured[i]=true; return true; }
function cleanPts(p){ const pts=p.map(q=>[...q]); let again=true;
  while(again && pts.length>=3){ again=false; for(let i=0;i<pts.length;i++){ const n=pts.length, a=pts[(i-1+n)%n], b=pts[i], c=pts[(i+1)%n];
    const cr=(b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0]); if(Math.hypot(b[0]-a[0],b[1]-a[1])<1e-6 || Math.abs(cr)<1e-6){ pts.splice(i,1); again=true; break; } } }
  return pts; }
const D45=Math.SQRT1_2;
const DIRS=[[1,0,'right','→'],[D45,D45,'down-right','↘'],[0,1,'down','↓'],[-D45,D45,'down-left','↙'],[-1,0,'left','←'],[-D45,-D45,'up-left','↖'],[0,-1,'up','↑'],[D45,-D45,'up-right','↗']];
const dirOf = (a,b) => ((Math.round(Math.atan2(b[1]-a[1],b[0]-a[0])/(Math.PI/4))%8)+8)%8;
const segKey = (a,b) => [a,b].map(q=>r96(q[0])+','+r96(q[1])).sort().join('|');
const snapTo = (v,g) => r96(Math.round(v/g)*g);

// ================= estimating =================
function estimate(room){
  const p=prod(room.productId); const holesA=(room.holes||[]).reduce((s,h)=>s+h.w*h.h,0);
  const A=Math.max(0,Math.abs(area(room.pts))-holesA), Pm=perim(room.pts), doorW=(room.doors||[]).reduce((s,d)=>s+d.w,0);
  const r={area:A, perim:Pm, baseLf:Math.max(0,Pm-doorW), p};
  if(!p) return r;
  const w=1+p.waste/100;
  if(p.kind==='roll'){ const b=bbox(room.pts); const horiz = room.seam==='h' ? true : room.seam==='v' ? false : b.w>=b.h;
    const run=horiz?b.w:b.h, across=horiz?b.h:b.w; const drops=Math.ceil(across/p.rollWidth-1e-9); const lf=drops*run*w;
    r.qty=Math.ceil(lf*p.rollWidth/9*10)/10; r.unit='sq yd'; r.detail=`${drops} drop${drops>1?'s':''} × ${fmtLen(run)}, seams run ${horiz?'left–right':'up–down'}`; r.mat=r.qty*(p.price+(p.pad||0)); }
  else { r.qty=Math.ceil(A*w/p.coverage-1e-9); r.unit=r.qty===1?'box':'boxes'; r.detail=`${num(r.qty*p.coverage,1)} sq ft delivered at ${p.waste}% waste`; r.mat=r.qty*p.price; }
  r.lab=A*p.labor; return r; }
function quote(pj){ pj=pj||P(); const S=DB.settings; const by=new Map(); let baseLf=0, trans=0, area=0;
  for(const room of pj.rooms){ const e=estimate(room); area+=e.area; if(room.base) baseLf+=e.baseLf; trans+=(room.doors||[]).filter(d=>d.trans!==false).length; if(!e.p) continue;
    const g=by.get(e.p.id)||{p:e.p,area:0,qty:0,mat:0,lab:0,rooms:[]}; g.area+=e.area; g.qty+=e.qty; g.mat+=e.mat; g.lab+=e.lab; g.rooms.push(room.name); by.set(e.p.id,g); }
  const lines=[...by.values()].map(g=>({label:g.p.name,color:g.p.color,sub:`${g.rooms.join(', ')} · ${num(g.area,1)} sq ft`,qty:g.p.kind==='roll'?num(Math.round(g.qty*10)/10,1):String(g.qty),unit:g.p.kind==='roll'?'sq yd':'boxes',mat:g.mat,lab:g.lab,area:g.area}));
  if(baseLf>0){ const pcs=Math.ceil(baseLf*1.1/8); lines.push({label:'Baseboard',sub:`${num(baseLf,1)} lf measured (doorways left out) · 8′ pieces at 10% waste`,qty:String(pcs),unit:'pieces',mat:pcs*8*S.bbPrice,lab:baseLf*S.bbLabor}); }
  if(trans>0) lines.push({label:'Transition strips',sub:'One per doorway marked for a transition',qty:String(trans),unit:'each',mat:trans*S.trPrice,lab:trans*S.trLabor});
  for(const x of pj.extras||[]) lines.push({label:x.name||'Item',sub:x.kind==='stairs'?'Stairs':'',qty:num(+x.qty||0,(+x.qty%1)?2:0),unit:x.unit||'',mat:(+x.qty||0)*(+x.price||0),lab:(+x.qty||0)*(+x.labor||0),extra:x.id});
  const mk=1+(+pj.markup||0)/100; lines.forEach(l=>{ l.mat*=mk; l.lab*=mk; });
  const mat=lines.reduce((s,l)=>s+l.mat,0), lab=lines.reduce((s,l)=>s+l.lab,0), tax=mat*(+pj.tax||0)/100;
  return {lines,mat,lab,tax,total:mat+lab+tax,area}; }

// Undo works one room at a time and only ever puts a room back the way it was. It never removes a room;
// a deleted room comes back on Undo, and Redo reverses an Undo.
function undoUi(){ $('undo-act').hidden=!undoStack.length&&mode!=='draw'; $('redo-act').hidden=!redoStack.length||mode==='draw'; }
function pushEntry(label,before,idx){ undoStack.push({id:before.id,before:clone(before),idx,label}); if(undoStack.length>60) undoStack.shift(); redoStack=[]; undoUi(); }
function pushUndo(label,r){ r=r||room(); if(!r) return; pushEntry(label,r,P().rooms.indexOf(r)); }
function putRoom(id,state,idx){ const rooms=P().rooms, cur=rooms.findIndex(x=>x.id===id);
  if(state===null){ if(cur>=0) rooms.splice(cur,1); } else if(cur>=0) rooms[cur]=clone(state); else rooms.splice(Math.min(Math.max(0,idx),rooms.length),0,clone(state)); }
function restoreSel(id){ if(P().rooms.some(x=>x.id===id)){ sel={room:id,wall:editing?sel.wall:null,door:null,hole:null}; const r=room(); if(sel.wall!=null&&sel.wall>=r.pts.length) sel.wall=0; } else { sel={room:null,wall:null,door:null,hole:null}; editing=false; } }
function popUndo(){ const u=undoStack.pop(); if(!u){ undoUi(); return; } const rooms=P().rooms, cur=rooms.findIndex(x=>x.id===u.id);
  redoStack.push({id:u.id,after:cur>=0?clone(rooms[cur]):null,idx:cur>=0?cur:u.idx,label:u.label}); putRoom(u.id,u.before,u.idx);
  restoreSel(u.id); save(); undoUi(); renderDraw(); toast('Undid: '+u.label,'Redo',popRedo); }
function popRedo(){ const e=redoStack.pop(); if(!e){ undoUi(); return; } const rooms=P().rooms, cur=rooms.findIndex(x=>x.id===e.id);
  if(cur>=0) undoStack.push({id:e.id,before:clone(rooms[cur]),idx:cur,label:e.label}); putRoom(e.id,e.after,e.idx);
  restoreSel(e.id); save(); undoUi(); renderDraw(); toast('Redid: '+e.label); }

  ['draw','products','sheet','proposal','info'].forEach(k=>{ $('v-'+k).hidden= home||tab!==k; $('t-'+k).setAttribute('aria-selected',String(!home&&tab===k)); });
  if(home){ renderHome(); return; }

// ================= keypad =================
function kpReset(){ kp.ft=''; kp.inch=''; kp.fr=0; kp.stage='ft'; }

function kpText(){ if(kp.ft===''&&kp.inch===''&&!kp.fr) return null; return `${kp.ft||0}′` + (kp.stage==='in'||kp.inch||kp.fr ? ` ${kp.inch}${FR[kp.fr]}″` : ''); }

  <div class="kp-fr">${FR.slice(1).map((f,i)=>`<button class="k${kp.fr===i+1?' on':''}" data-k="fr${i+1}" aria-label="${i+1} eighths">${f}</button>`).join('')}</div>
  <div class="kp-keys">
   ${['7','8','9','bk','4','5','6','ftin','1','2','3','clr','-','0','+','set'].map(k=>{ const lab={bk:'⌫',ftin:kp.stage==='ft'?'ft ▸ in':'in',clr:'Clear','-':'−⅛″','+':'+⅛″',set:'Set'}[k]||k;

     return `<button class="${cls}" data-k="${k}" aria-label="${{bk:'Backspace',ftin:'Switch to inches',clr:'Clear','-':'Shorten by an eighth','+':'Lengthen by an eighth',set:'Set length'}[k]||k}">${lab}</button>`; }).join('')}
  </div></div>`; }

  document.querySelectorAll('#kp [data-k^="fr"]').forEach((b,i)=>b.classList.toggle('on',kp.fr===i+1));
  const ft=document.querySelector('#kp [data-k="ftin"]'); if(ft){ ft.textContent=kp.stage==='ft'?'ft ▸ in':'in'; ft.classList.toggle('on',kp.stage==='in'); } }
function kpPress(k){
  if(/^\d$/.test(k)){ if(kp.stage==='ft'){ if(kp.ft.length<3) kp.ft+=k; } else { if(kp.inch.length<2 && +(kp.inch+k)<12) kp.inch+=k; } }
  else if(k==='ftin'){ kp.stage='in'; }
  else if(k==='bk'){ if(kp.fr) kp.fr=0; else if(kp.stage==='in'&&kp.inch) kp.inch=kp.inch.slice(0,-1); else if(kp.stage==='in') kp.stage='ft'; else kp.ft=kp.ft.slice(0,-1); }

// What the keypad, the nudge buttons and the laser act on right now
function target(){

  const r=room(); if(!r) return {kind:'none'};
  if(sel.door!=null&&r.doors[sel.door]) return {kind:'door',r,d:r.doors[sel.door]};
  if(sel.hole!=null&&r.holes[sel.hole]) return {kind:'hole',r};
  if(editing&&sel.wall!=null) return {kind:'wall',r};
  return {kind:'room',r}; }

  if(t.kind==='wall'){ const a=axisOf(t.r.pts,sel.wall); return a?fmtLen(a.L):'0′'; }
  if(t.kind==='draw'&&draft.length>=2){ const a=draft[draft.length-2], b=draft[draft.length-1]; return fmtLen(Math.hypot(b[0]-a[0],b[1]-a[1])); }
  if(t.kind==='door') return fmtLen(t.d.w);
  if(t.kind==='size'&&sizeEntry.target==='hole'){ const o=room().holes[sel.hole]; return o?fmtLen(sizeEntry.step==='w'?o.w:o.h):'0′'; }
  return '0′'; }
function applyLength(L,src){ const t=target();

  if(t.kind==='door'){ pushUndo('doorway width'); t.d.w=r96(L); save(); renderDraw(); sheetMsg(`Doorway set to ${fmtLen(L)}.`,'ok'); return; }
  if(t.kind==='size') return sizeStep(L);

  // nothing selected: a reading starts a new room going right

  if(t.kind==='wall'){ const a=axisOf(t.r.pts,sel.wall); if(a){ wallPicked=true; applyWall(Math.max(1/96,a.L+d),true); } }
  else if(t.kind==='draw'&&draft.length>=2){ const a=draft[draft.length-2], b=draft[draft.length-1]; drawLength(Math.max(1/96,Math.hypot(b[0]-a[0],b[1]-a[1])+d),true); }

    const status = !n ? 'Tap where the first corner is.' : n===1 ? 'Tap the direction the first wall runs, then shoot it with the D2 or type its length.' : shotLast ? 'Tap the direction of the next wall, or shoot again to go on turning right.' : 'Shoot this wall with the D2, or type its length. Drag to adjust it.';

function productOptions(id){ return '<option value="">— No flooring —</option>'+DB.products.map(p=>`<option value="${p.id}"${p.id===id?' selected':''}>${esc(p.name)}</option>`).join(''); }
function flash(){ sheet.classList.add('flash'); setTimeout(()=>sheet.classList.remove('flash'),350); }

sheet.addEventListener('click',e=>{ const c=e.target.closest('[data-chip]'); if(c){ sel.wall=+c.dataset.chip; wallPicked=true; kpReset(); renderDraw(); return; }

    case 'hole-del': pushUndo('remove cutout'); r.holes.splice(sel.hole,1); sel.hole=null; save(); renderDraw(); break;

    case 'w-prev': case 'w-next': { const n=r.pts.length; sel.wall=((sel.wall+(a==='w-next'?1:-1))%n+n)%n; wallPicked=true; kpReset(); renderDraw(); break; }
    case 'w-done': editing=false; sel.wall=null; renderDraw(); break;
    case 'kp-show': kpShow=true; renderSheet(); break;
    case 'kp-hide': kpShow=false; renderSheet(); break;
    case 'r-measure': editing=true; wallPicked=false; sel.wall=nextNeeded(r,-1)??0; kpReset(); renderDraw(); break;
    case 'r-door': addDoor(); break;
    case 'r-hole': addHole(); break;
    case 'r-rotate': transformRoom(r,'rotate'); break;
    case 'r-flip': transformRoom(r,'flip'); break;
    case 'r-copy': copyRoom(r); break;
    case 'r-desel': sel={room:null,wall:null,door:null,hole:null}; editing=false; renderDraw(); break;
    case 'r-del': { pushUndo('delete '+r.name); const name=r.name; P().rooms=P().rooms.filter(x=>x!==r); sel={room:null,wall:null,door:null,hole:null}; editing=false; save(); renderDraw(); toast(`Deleted ${name}`,'Undo',popUndo); break; }
  } });
sheet.addEventListener('input',e=>{ const r=room(); if(!r) return;
  if(e.target.id==='rm-name'){ r.name=e.target.value; save(); renderCanvas(); } });

function freeSpot(){ const all=P().rooms.flatMap(r=>r.pts); return all.length?[snapTo(Math.max(...all.map(q=>q[0]))+3,1), snapTo(Math.min(...all.map(q=>q[1])),1)]:[0,0]; }
function addRoom(pts,measured,name){ const r=normRoom({id:uid('r'),name:name||'Room '+(P().rooms.length+1),pts,productId:DB.products[0]?.id||'',base:true,measured,doors:[],holes:[]}); P().rooms.push(r); save(); return r; }
function addShape(k){ const [x0,y0]=freeSpot();
  const S={L:[[0,0],[16,0],[16,8],[10,8],[10,14],[0,14]], T:[[0,0],[20,0],[20,6],[13,6],[13,16],[7,16],[7,6],[0,6]], U:[[0,0],[6,0],[6,8],[12,8],[12,0],[18,0],[18,14],[0,14]]}[k];
  const r=addRoom(S.map(([x,y])=>[x0+x,y0+y]),S.map(()=>false),k+'-shaped room'); setMode('select'); sel={room:r.id,wall:0,door:null,hole:null}; editing=true; wallPicked=false; kpReset(); fit(); }
function addDoor(){ const r=room(); if(!r) return; let wi=editing&&sel.wall!=null?sel.wall:null;
  if(wi==null){ let best=0,bl=0; r.pts.forEach((_,i)=>{ const a=axisOf(r.pts,i); if(a&&a.L>bl){bl=a.L;best=i;} }); wi=best; }
  pushUndo('add doorway'); r.doors.push({wall:wi,t:0.5,w:3,trans:true}); sel.door=r.doors.length-1; sel.hole=null; editing=false; kpReset(); save(); renderDraw(); sheetMsg('Doorway added on the '+sideOf(r,wi)+' wall. Drag it to its spot, or tap a different wall first to move it there.'); }
function addHole(){ const r=room(); if(!r) return; const [cx,cy]=centroid(r.pts); pushUndo('add cutout');
  r.holes.push({x:snapTo(cx-2,0.5),y:snapTo(cy-1.25,0.5),w:4,h:2.5}); sel.hole=r.holes.length-1; sel.door=null; editing=false; save(); sizeEntry={target:'hole',step:'w'}; kpReset(); renderDraw(); }
function sizeStep(L){ if(sizeEntry.step==='w'){ sizeEntry.w=L; sizeEntry.step='l'; kpReset(); renderDraw(); flash(); return; }
  const W=sizeEntry.w, H=L, tgt=sizeEntry.target; sizeEntry=null;
  if(tgt==='newroom'){ const [x0,y0]=freeSpot(); const r=addRoom([[x0,y0],[r96(x0+W),y0],[r96(x0+W),r96(y0+H)],[x0,r96(y0+H)]],[true,true,false,false]);
    sel={room:r.id,wall:null,door:null,hole:null}; editing=false; fit(); sheetMsg(`${r.name} added · ${fmtLen(W)} × ${fmtLen(H)} = ${num(W*H,1)} sq ft. Name it and pick the flooring.`,'ok'); }
  else { const r=room(), o=r&&r.holes[sel.hole]; if(o){ pushUndo('cutout size'); const cx=o.x+o.w/2, cy=o.y+o.h/2; o.w=r96(W); o.h=r96(H); o.x=r96(cx-W/2); o.y=r96(cy-H/2); save(); } renderDraw(); } }
function transformRoom(r,how){ pushUndo(how+' room'); const [cx,cy]=centroid(r.pts);
  if(how==='rotate'){ r.pts=r.pts.map(([x,y])=>[r96(cx-(y-cy)), r96(cy+(x-cx))]); r.holes.forEach(o=>{ const hx=o.x+o.w/2, hy=o.y+o.h/2, nx=cx-(hy-cy), ny=cy+(hx-cx); [o.w,o.h]=[o.h,o.w]; o.x=r96(nx-o.w/2); o.y=r96(ny-o.h/2); }); }
  else { r.pts=r.pts.map(([x,y])=>[r96(2*cx-x),y]); r.holes.forEach(o=>{ o.x=r96(2*cx-o.x-o.w); }); }
  save(); renderDraw(); }
function copyRoom(r){ const c=clone(r); c.id=uid('r'); c.name=r.name+' copy'; const b=bbox(r.pts), dx=snapTo(b.w+2,0.5); c.pts=c.pts.map(([x,y])=>[x+dx,y]); c.holes.forEach(o=>o.x+=dx);
  P().rooms.push(c); sel={room:c.id,wall:null,door:null,hole:null}; editing=false; save(); fit(); }

// ================= modes =================
function setMode(m){ mode=m; setTimeout(undoUi,0); draft=[]; draftKeys=new Set(); shotLast=false; hover=null; aim=null; rectPrev=null; kpReset(); if(m!=='select'){ editing=false; } renderDraw(); }
// Free draw: where a finger at `raw` puts the next corner (90° or 45° lock, grid lengths, line up with nearby corners)
function drawSnap(raw){
  const px=view.w/svgW(), tol=24*px, g=gridStep(), last=draft[draft.length-1];
  const cands=draft.concat(P().rooms.flatMap(r=>r.pts));
  if(draft.length>=3 && Math.hypot(raw[0]-draft[0][0],raw[1]-draft[0][1])<tol*1.5) return {pt:[...draft[0]],close:true};
  if(!last){ let best=null,bd=tol; for(const c of cands){ const d=Math.hypot(raw[0]-c[0],raw[1]-c[1]); if(d<bd){bd=d;best=c;} } return {pt:best?[...best]:[snapTo(raw[0],g),snapTo(raw[1],g)]}; }
  const dx=raw[0]-last[0], dy=raw[1]-last[1], di=dirOf(last,raw);
  if(ang45 && di%2===1){ const u=DIRS[di]; const len=Math.max(0,Math.round((dx*u[0]+dy*u[1])/g)*g); return {pt:[r96(last[0]+u[0]*len), r96(last[1]+u[1]*len)]}; }
  if(ang45 ? (di===0||di===4) : Math.abs(dx)>=Math.abs(dy)){ let x=last[0]+Math.round(dx/g)*g, gx=null, bd=tol;
    for(const c of cands){ if(c===last) continue; const d=Math.abs(raw[0]-c[0]); if(d<bd){bd=d;x=c[0];gx=c[0];} } return {pt:[r96(x),last[1]],guideX:gx}; }
  let y=last[1]+Math.round(dy/g)*g, gy=null, bd=tol;
  for(const c of cands){ if(c===last) continue; const d=Math.abs(raw[1]-c[1]); if(d<bd){bd=d;y=c[1];gy=c[1];} } return {pt:[last[0],r96(y)],guideY:gy}; }
function liveUpdate(){ const el=$('live'); if(!el) return; if(!aim){ el.textContent=''; return; } if(aim.close){ el.textContent='lift to close'; return; }
  const last=draft[draft.length-1]; if(!last){ el.textContent='lift to start here'; return; } const L=Math.hypot(aim.pt[0]-last[0],aim.pt[1]-last[1]); el.innerHTML= L>0?`<b>${fmtLen(L)}</b> ${DIRS[dirOf(last,aim.pt)][3]}`:''; }
function placeAim(){ const a=aim; aim=null; if(!a) return; if(a.close){ hover=null; closeDraft(); return; }
  const last=draft[draft.length-1]; if(last && Math.hypot(a.pt[0]-last[0],a.pt[1]-last[1])<1e-6){ renderDraw(); return; }
  draft.push(a.pt); shotLast=false; kpReset(); renderDraw(); if(draft.length===2) fitIfOut(a.pt); }
// Set the active (last) wall to length L along the direction it was tapped; with no active wall, add one turning right.
function drawLength(L,isNudge){
  if(!draft.length) draft.push(freeSpot());
  if(draft.length===1 || (shotLast && !isNudge)){ const last=draft[draft.length-1]; let dir=0;
    if(draft.length>=2) dir=(dirOf(draft[draft.length-2],last)+2)%8;
    const u=DIRS[dir]; draft.push([r96(last[0]+u[0]*L), r96(last[1]+u[1]*L)]); }
  else { const a=draft[draft.length-2], b=draft[draft.length-1]; const d=Math.hypot(b[0]-a[0],b[1]-a[1]); const u= d>1e-9?[(b[0]-a[0])/d,(b[1]-a[1])/d]:[1,0];
    draftKeys.delete(segKey(a,b)); draft[draft.length-1]=[r96(a[0]+u[0]*L), r96(a[1]+u[1]*L)]; }
  const a=draft[draft.length-2], b=draft[draft.length-1]; draftKeys.add(segKey(a,b)); shotLast=true;
  const miss=Math.hypot(b[0]-draft[0][0],b[1]-draft[0][1]);
  if(draft.length>=5 && miss<0.75){ draftKeys.add(segKey(a,draft[0])); return closeDraft(miss); }
  fitIfOut(b); renderDraw(); flash(); }
function fitIfOut(p){ const m=fs0()*2, H=view.h-sheetCover()*view.w/svgW(); if(p[0]<view.x+m||p[0]>view.x+view.w-m||p[1]<view.y+m||p[1]>view.y+H-m) fit(); }
function undoPoint(){ if(!draft.length) return; const gone=draft.pop(); const prev=draft[draft.length-1]; if(prev) draftKeys.delete(segKey(prev,gone)); shotLast= draft.length>=2 && draftKeys.has(segKey(draft[draft.length-2],draft[draft.length-1])); renderDraw(); }
function closeDraft(autoGap){
  if(draft.length<3){ sheetMsg('Draw at least two walls before closing the room.','err'); return; }
  let pts=draft.map(q=>[...q]); const f=pts[0]; const l=pts[pts.length-1]; const ex=Math.abs(f[0]-l[0]), ey=Math.abs(f[1]-l[1]); let gap=typeof autoGap==='number'?autoGap:0;
  if(ex>1e-6 && ey>1e-6){ const n=pts.length, pl=pts[n-2], lastHoriz=Math.abs(pl[1]-l[1])<1e-6, lastVert=Math.abs(pl[0]-l[0])<1e-6;
    if((lastHoriz||lastVert) && (lastHoriz?ey<0.75:ex<0.75) && n>=4){ gap=Math.max(gap,lastHoriz?ey:ex); if(lastHoriz){ pts[n-1][1]=f[1]; pts[n-2][1]=f[1]; } else { pts[n-1][0]=f[0]; pts[n-2][0]=f[0]; } }
    else pts.push(lastHoriz?[l[0],f[1]]:[f[0],l[1]]); }
  pts=cleanPts(pts);
  if(pts.length<3||Math.abs(area(pts))<0.25){ sheetMsg('That shape has no floor area. Tap Undo and try again.','err'); return; }
  const measured=pts.map((q,i)=>draftKeys.has(segKey(q,pts[(i+1)%pts.length])));
  const r=addRoom(pts,measured); r.gap=gap>1/96?gap:0; save(); setMode('select'); sel={room:r.id,wall:null,door:null,hole:null};
  const sq=num(estimate(r).area,1);
  if(needCount(r)){ editing=true; wallPicked=false; sel.wall=nextNeeded(r,-1); fit(); sheetMsg(`Room drawn. Shoot each orange wall for an exact size, starting with the ${sideOf(r,sel.wall)} wall.`); }
  else { fit(); sheetMsg(gap>1/12?`⚠ Readings missed the first corner by ${fmtIn(gap)}, so the last wall was moved to close the room (${sq} sq ft). Reshoot if that seems high.`:`${r.name} closed · ${sq} sq ft. Name it and pick the flooring.`, gap>1/12?'err':'ok'); } }

// ================= measuring walls =================
function applyWall(L,isNudge){ const r=room(); if(!r) return; const i=sel.wall; pushUndo('wall '+(i+1));
  const res=setWall(r,i,L); if(res!==true){ undoStack.pop(); sheetMsg(res,'err'); return; }
  save(); if(isNudge){ renderDraw(); return; }
  const nx=wallPicked?null:nextNeeded(r,i); wallPicked=false;
  if(nx==null && !needCount(r)){ renderDraw(); sheetMsg(`Wall ${i+1} set to ${fmtLen(L)}. ${r.name} is done · ${num(estimate(r).area,1)} sq ft.`,'ok'); }
  else { sel.wall = nx ?? nextNeeded(r,-1) ?? i; renderDraw(); sheetMsg(`Wall ${i+1} set to ${fmtLen(L)}. Next: the ${sideOf(r,sel.wall)} wall.`,'ok'); }
  flash(); }

// ================= pointer input =================
function pinchStart(){ const [a,b]=[...pointers.values()]; const r=room();

svg.addEventListener('pointerdown',e=>{ if(e.pointerType!=='mouse') lastCanvasTouch=Date.now();

  if(mode==='rect'){ const g=gridStep(); const p0=[snapTo(w[0],g),snapTo(w[1],g)]; drag={type:'rect',p0}; rectPrev=[...p0,...p0]; renderCanvas(); return; }
  if(sizeEntry){ drag={type:'pan',sx:e.clientX,sy:e.clientY,v:{...view},moved:false,keep:true}; return; }
  if(t.dataset.door!=null&&r){ sel.door=+t.dataset.door; sel.hole=null; editing=false; drag={type:'door',di:sel.door,dorig:r.doors[sel.door].t,moved:false}; kpReset(); renderDraw(); return; }
  if(t.dataset.hole!=null&&r&&t.dataset.hroom===r.id){ sel.hole=+t.dataset.hole; sel.door=null; editing=false; const o=r.holes[sel.hole]; drag={type:'hole',hi:sel.hole,horig:{...o},sx:e.clientX,sy:e.clientY,moved:false}; renderDraw(); return; }

    const r=room(); if(!r) return;
    if(sel.door!=null){ pushUndo('move doorway'); r.doors[sel.door].wall=i; r.doors[sel.door].t=0.5; save(); renderDraw(); drag={type:'none'}; return; }
    sel.wall=i; editing=true; wallPicked=true; sel.door=null; sel.hole=null; kpReset(); renderDraw(); drag={type:'wall',i,sx:e.clientX,sy:e.clientY,orig:r.pts.map(q=>[...q]),moved:false}; return; }

    else if(sel.door!=null||sel.hole!=null){ sel.door=null; sel.hole=null; renderDraw(); }
    const rr=room(); drag={type:'room',orig:rr.pts.map(q=>[...q]),holes:clone(rr.holes),moved:false,sx:e.clientX,sy:e.clientY}; return; }
  drag={type:'pan',sx:e.clientX,sy:e.clientY,v:{...view},moved:false}; });
svg.addEventListener('pointermove',e=>{

  if(drag&&drag.type==='pinch'){ if(pointers.size<2) return; const [a,b]=[...pointers.values()]; const d=Math.hypot(a[0]-b[0],a[1]-b[1])||1;
    const nw=Math.min(400,Math.max(5,drag.v.w*drag.d0/d)), rc=svg.getBoundingClientRect(), sc=nw/svgW(), cx=(a[0]+b[0])/2-rc.left, cy=(a[1]+b[1])/2-rc.top;

  if(!r) return;
  if(drag.type==='door'){ const d=r.doors[drag.di], gm=doorGeom(r,d); if(!gm) return; const along=(w[0]-gm.a0[0])*gm.ux+(w[1]-gm.a0[1])*gm.uy; d.t=Math.min(1,Math.max(0,snapTo(along,1/12)/gm.L)); drag.moved=true; renderCanvas(); return; }
  const cdx=drag.sx!=null?(e.clientX-drag.sx)*px:0, cdy=drag.sy!=null?(e.clientY-drag.sy)*px:0, cmoved=drag.sx!=null?Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy):0;

  if(drag.type==='vertex'){ if(!drag.moved && Math.hypot(e.clientX-drag.start[0],e.clientY-drag.start[1])<12) return; drag.moved=true;
    const o=drag.orig, n=o.length, i=drag.i, a=(i-1+n)%n, b=(i+1)%n, p=o.map(q=>[...q]); p[i]=[snapTo(w[0],g),snapTo(w[1],g)];
    for(const k of [a,b]){ if(Math.abs(o[k][1]-o[i][1])<1e-6) p[k]=[o[k][0],p[i][1]]; else if(Math.abs(o[k][0]-o[i][0])<1e-6) p[k]=[p[i][0],o[k][1]]; } r.pts=p; renderCanvas(); return; }
  if(drag.type==='wall'){ const o=drag.orig, i=drag.i, j=(i+1)%o.length, ax=axisOf(o,i); if(!ax||ax.ax==='d') return; const d= ax.ax==='x'?cdy:cdx;

    if(ax.ax==='x'){ p[i][1]=r96(o[i][1]+dd); p[j][1]=r96(o[j][1]+dd); } else { p[i][0]=r96(o[i][0]+dd); p[j][0]=r96(o[j][0]+dd); } r.pts=p; renderCanvas(); return; }

    r.pts=drag.orig.map(q=>[r96(q[0]+dx),r96(q[1]+dy)]); r.holes.forEach((o,k)=>{ o.x=r96(drag.holes[k].x+dx); o.y=r96(drag.holes[k].y+dy); }); renderCanvas(); } });
function pointerEnd(e){ if(e.pointerType!=='mouse') lastCanvasTouch=Date.now(); pointers.delete(e.pointerId); if(!pointers.size && screen==='project' && tab==='draw' && mode==='select' && (editing||sel.door!=null||sel.hole!=null)) requestAnimationFrame(keepInView); if(!drag) return; const d=drag;
  if(d.type==='pinch'){ if(pointers.size===0) drag=null; return; }
  drag=null; const r=room();
  if(d.type==='aim'){ placeAim(); if(e.pointerType!=='mouse'){ hover=null; renderCanvas(); } return; }
  if(d.type==='rect'){ const [x1,y1,x2,y2]=rectPrev||[0,0,0,0]; rectPrev=null; const x=Math.min(x1,x2), y=Math.min(y1,y2), w=Math.abs(x2-x1), h=Math.abs(y2-y1);
    if(w<1||h<1){ renderDraw(); sheetMsg('Drag farther to draw a room at least 1 ft across.','err'); return; }
    const nr=addRoom([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],[false,false,false,false]); mode='select'; sel={room:nr.id,wall:0,door:null,hole:null}; editing=true; wallPicked=false; kpReset(); renderDraw(); sheetMsg('Now shoot the top wall, then the right wall. The other two follow.'); return; }
  if(d.type==='pan'){ if(!d.moved && !d.keep && sel.room){ sel={room:null,wall:null,door:null,hole:null}; editing=false; renderDraw(); } return; }
  if(!r) return;
  if((d.type==='vertex'||d.type==='wall')&&d.moved){ pushEntry('reshape '+r.name,Object.assign(clone(r),{pts:d.orig}),P().rooms.indexOf(r));
    r.pts.forEach((_,k)=>{ const a=axisOf(r.pts,k), b=axisOf(d.orig,k); if(!a||!b||Math.abs(a.L-b.L)>1/192) r.measured[k]=false; }); save(); renderDraw(); return; }

svg.addEventListener('pointerup',pointerEnd); svg.addEventListener('pointercancel',pointerEnd);
// A finger tap on the drawing must not also "click" whatever panel slides up under the finger (the keypad, a wall chip).
svg.addEventListener('touchstart',e=>{ lastCanvasTouch=Date.now(); e.preventDefault(); },{passive:false});
svg.addEventListener('touchend',e=>{ lastCanvasTouch=Date.now(); e.preventDefault(); },{passive:false});
// A real tap on the panel always starts with its own pointerdown there; the phantom one never does.
let lastOtherDown=0; document.addEventListener('pointerdown',e=>{ if(!svg.contains(e.target)) lastOtherDown=Date.now(); },true);
['click','mousedown','mouseup'].forEach(t=>document.addEventListener(t,e=>{ if(Date.now()-lastCanvasTouch<700 && lastOtherDown<lastCanvasTouch && !svg.contains(e.target)){ e.stopPropagation(); e.preventDefault(); } },true));

svg.addEventListener('wheel',e=>{ e.preventDefault(); const w=toWorld(e.clientX,e.clientY), f=e.deltaY>0?1.12:1/1.12, nw=Math.min(400,Math.max(5,view.w*f)), k=nw/view.w; view.x=w[0]-(w[0]-view.x)*k; view.y=w[1]-(w[1]-view.y)*k; view.w=nw; renderCanvas(); },{passive:false});

function warnings(pj){ const rough=pj.rooms.filter(r=>needCount(r)), gappy=pj.rooms.filter(r=>r.gap>1/12), none=pj.rooms.filter(r=>!prod(r.productId)); const n=[];
  if(rough.length) n.push(`${rough.map(r=>r.name).join(', ')} ${rough.length>1?'have':'has'} walls that weren't measured, so ${rough.length>1?'those sizes are':'that size is'} only a sketch.`);
  if(gappy.length) n.push(`${gappy.map(r=>`${r.name} (${fmtIn(r.gap)})`).join(', ')} closed with a gap.`);
  if(none.length) n.push(`${none.map(r=>r.name).join(', ')} ${none.length>1?'have':'has'} no flooring picked.`); return n; }

// ================= DISTO D2 over Bluetooth LE =================
// Native app: @capacitor-community/bluetooth-le. Browsers with Web Bluetooth (Chrome on Android, Bluefy on iPhone) use navigator.bluetooth.
// The D2 sends each reading as a notification: a 4-byte little-endian float, in meters.
const D2_MEAS='3ab10101-f831-4395-b29d-570977d5bf94', D2_SERVICE='3ab10100-f831-4395-b29d-570977d5bf94';
const Cap=window.Capacitor, BLE=Cap&&Cap.isNativePlatform&&Cap.isNativePlatform()&&Cap.registerPlugin?Cap.registerPlugin('BluetoothLe'):null;
const policy=document.permissionsPolicy||document.featurePolicy;
const WEBBLE=!BLE&&!!navigator.bluetooth&&!!(!policy||!policy.allowsFeature||policy.allowsFeature('bluetooth'));
let bleSubs=[], lastBleAt=0;
function bleStatus(t,ok){ const el=$('ble-state'); el.textContent=t; el.classList.toggle('on',!!ok); }
function bleUi(){ $('ble-connect').hidden=!!bleDev||!(BLE||WEBBLE); $('ble-disconnect').hidden=!bleDev; }
let lastBleVal=0;
function onMeters(m){ const now=Date.now(); if(!(m>0)||now-lastBleAt<400) return; if(Math.abs(m-lastBleVal)<0.0005 && now-lastBleAt<2000) return; lastBleAt=now; lastBleVal=m; if(screen!=='project') return; if(tab!=='draw') go('project','draw'); applyLength(r96(m*3.28084),'laser'); }
function connected(name){ bleUi(); bleStatus('● '+(name||'D2'),true); kpShow=false; if(tab==='draw') sheetMsg('D2 connected. Each press of the measure button fills the highlighted wall.','ok'); }
function bleLost(){ bleDev=null; bleUi(); bleStatus('D2 disconnected'); kpShow=true; if(tab==='draw') renderSheet(); }
async function webConnect(){ try{ bleStatus('Searching…');
    const dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'DISTO'}],optionalServices:[D2_SERVICE]});
    bleStatus('Connecting…'); const server=await dev.gatt.connect(); const svc=await server.getPrimaryService(D2_SERVICE); const ch=await svc.getCharacteristic(D2_MEAS);
    ch.addEventListener('characteristicvaluechanged',e=>{ const v=e.target.value; if(v.byteLength>=4) onMeters(v.getFloat32(0,true)); });
    await ch.startNotifications(); dev.addEventListener('gattserverdisconnected',bleLost); bleDev={deviceId:dev.id,name:dev.name,web:dev}; connected(dev.name);
  }catch(err){ bleDev=null; bleUi(); bleStatus(''); if(err&&err.name==='NotFoundError') return; toast('Could not connect: '+String(err&&err.message||err)); } }
function hexToView(v){ if(v instanceof DataView) return v; const hex=String(v).replace(/[^0-9a-f]/gi,''); const b=new Uint8Array(hex.length/2); for(let i=0;i<b.length;i++) b[i]=parseInt(hex.substr(i*2,2),16); return new DataView(b.buffer); }
async function nativeConnect(){ try{ bleStatus('Searching…'); await BLE.initialize({});
    const dev=await BLE.requestDevice({namePrefix:'DISTO',optionalServices:[D2_SERVICE]}); bleStatus('Connecting…'); await BLE.connect({deviceId:dev.deviceId});
    const {services}=await BLE.getServices({deviceId:dev.deviceId}); const svc=(services||[]).find(s=>(s.characteristics||[]).some(c=>c.uuid.toLowerCase()===D2_MEAS));
    if(!svc) throw new Error('This device does not send DISTO measurements. Check that it is a DISTO D2 with Bluetooth on.');
    const service=svc.uuid.toLowerCase();
    bleSubs.push(await BLE.addListener(`notification|${dev.deviceId}|${service}|${D2_MEAS}`,ev=>{ const dv=hexToView(ev.value); if(dv.byteLength>=4) onMeters(dv.getFloat32(0,true)); }));
    bleSubs.push(await BLE.addListener(`disconnected|${dev.deviceId}`,bleLost));
    await BLE.startNotifications({deviceId:dev.deviceId,service,characteristic:D2_MEAS}); bleDev=dev; connected(dev.name);
  }catch(err){ bleDev=null; bleUi(); bleStatus(''); toast(String(err&&err.message||err).replace(/^Error:\s*/,'')); } }
async function bleDisconnect(){ if(!bleDev) return; try{ if(bleDev.web) bleDev.web.gatt.disconnect(); else await BLE.disconnect({deviceId:bleDev.deviceId}); }catch(e){} bleSubs.forEach(s=>s.remove&&s.remove()); bleSubs=[]; bleLost(); }
$('ble-connect').onclick=BLE?nativeConnect:webConnect; $('ble-disconnect').onclick=bleDisconnect; bleUi();

// ================= no accidental zoom =================
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
['gesturestart','gesturechange'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
let lastTouchEnd=0; document.addEventListener('touchend',e=>{ const now=Date.now(); if(now-lastTouchEnd<350 && e.target.closest && e.target.closest('button')){ e.preventDefault(); e.target.closest('button').click(); } lastTouchEnd=now; },{passive:false});

// ================= start =================
let ui=null; try{ ui=JSON.parse(localStorage.getItem(KEY+'-ui')); }catch(e){}
if(ui&&ui.screen==='project'&&DB.projects.some(p=>p.id===ui.current)){ DB.current=ui.current; go('project',ui.tab||'draw'); } else go('home');
})();
